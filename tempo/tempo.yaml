#apiVersion: v1
#kind: Namespace
#metadata:
#  name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: monitoring
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317

    ingester:
      lifecycler:
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
      max_block_duration: 5m

    compactor:
      ring:
        kvstore:
          store: inmemory

    metrics_generator:
      registry:
        external_labels:
          source: tempo
      storage:
        path: /var/tempo/generator/wal

      ring:
        kvstore:
          store: inmemory

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
      - name: tempo
        image: grafana/tempo:2.6.0
        args:
          - "-config.file=/etc/tempo/tempo.yaml"
        ports:
          - containerPort: 3200
          - containerPort: 4318
          - containerPort: 4317
          - containerPort: 7946
          - containerPort: 9095
        volumeMounts:
        - name: config
          mountPath: /etc/tempo
        - name: data
          mountPath: /var/tempo
      volumes:
      - name: config
        configMap:
          name: tempo-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: monitoring
spec:
  type: NodePort
  ports:
  - name: http
    port: 3200
    targetPort: 3200
    nodePort: 31200
  - name: otlp-http
    port: 4318
    targetPort: 4318
    nodePort: 31318
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
    nodePort: 31317
  selector:
    app: tempo
