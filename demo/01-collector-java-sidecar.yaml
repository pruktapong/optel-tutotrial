apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: optel
  namespace: java-test
spec:
  mode: sidecar
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
            max_recv_msg_size_mib: 16
          http:
            endpoint: "0.0.0.0:4318"

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      batch:
        send_batch_size: 128
        timeout: 5s

    exporters:
      debug:
        verbosity: detailed
      otlp:
        endpoint: "tempo.observability.svc:4317"
        tls:
          insecure: true
      otlphttp:
        endpoint: "http://tempo.observability.svc:4318"

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug, otlp, otlphttp]
