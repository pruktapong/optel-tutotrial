apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: optel
  namespace: java-test
spec:
  mode: deployment
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
            max_recv_msg_size_mib: 16
          http:
            endpoint: "0.0.0.0:4318"
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
    exporters:
      debug:
        verbosity: detailed
      otlp:
        endpoint: "tempo.observability.svc:4317"
        tls:
          insecure: true
      otlphttp:
        endpoint: "http://tempo.observability.svc:4318"

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter]
          exporters: [debug,otlp,otlphttp]
        # metrics:
        #   receivers: [otlp]
        #   processors: [memory_limiter]
        #   exporters: [debug]
        # logs:
        #   receivers: [otlp]
        #   processors: [memory_limiter]
        #   exporters: [debug]
